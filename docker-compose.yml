services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: rag_app
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
    environment:
      - PHP_IDE_CONFIG=serverName=rag-server
    networks:
      - rag_network
    depends_on:
      - db

  db:
    image: pgvector/pgvector:pg17
    container_name: rag_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-rag_db}
      POSTGRES_USER: ${DB_USERNAME:-rag_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pg123456}
    volumes:
      - rag_db_data:/var/lib/postgresql/data
    networks:
      - rag_network

networks:
  rag_network:
    driver: bridge

volumes:
  rag_db_data:
    driver: local
